services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: my_sql_server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuperStrongPassword@2026
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SuperStrongPassword@2026' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./TrainingCoursesSystem.Server
      dockerfile: Dockerfile
    container_name: my_dotnet_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__TrainingInstituteDB=Server=sqlserver,1433;Database=TrainingDb;User Id=sa;Password=SuperStrongPassword@2026;TrustServerCertificate=True;
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./trainingcoursessystem.client
      dockerfile: Dockerfile
    container_name: my_react_app
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sql_data: